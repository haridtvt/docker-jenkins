apiVersion: v1
kind: Service
metadata:
  name: {{ include "helm.MysqlServiceName" . }}-mysql
  labels:
    {{- include "helm.SvcMysqlLabels" . | nindent 4 }}
spec:
  type: {{ .Values.mysql.service.type }}
  ports:
    - port: {{ .Values.mysql.service.port }}
      targetPort: 3306
      protocol: TCP
      name: mysql-port
  selector:
        {{- include "helm.MysqlLabels" . | nindent 4 }}
