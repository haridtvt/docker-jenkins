apiVersion: v1
kind: Service
metadata:
  name: {{ include "helm.FrontendServiceName" . }}-frontend
  labels:
    {{- include "helm.SvcFrontendLabels" . | nindent 4 }}
spec:
  type: {{ .Values.frontend.service.type }}
  selector:
      {{- include "helm.FrontendLabels" . | nindent 4 }}
  ports:
    - name: frontend-port
      protocol: TCP
      port: {{ .Values.frontend.service.port }}
      targetPort: 80
      nodePort: {{ .Values.frontend.service.nodeport }}