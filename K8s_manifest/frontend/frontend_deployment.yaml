apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kubernetes.io/change-cause: update request, limit resources
  name: application-deployment-frontend
  namespace: test
  labels:
    app: frontend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: haridtvt/app-frontend:v31
        ports:
        - containerPort: 80
        env:
          - name: DNS_RESOLVE
            valueFrom:
              configMapKeyRef:
                name: app-config-map
                key: dns_resolve
          - name: SERVICE_BACKEND
            valueFrom:
              configMapKeyRef:
                name: app-config-map
                key: service_backend
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "300m"
            memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: application-svc-frontend
  namespace: test
spec:
  type: NodePort
#  type: LoadBalancer
  selector:
    app: frontend
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080
